name: Prüfen
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests
      - run: bun run build
      - name: Browser bereitstellen
        run: bun --bun node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Produktionsbuild in Chromium und Firefox prüfen
        run: |
          bun run start > /tmp/metro-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          bun run test:browser
